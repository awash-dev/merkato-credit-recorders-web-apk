name: Web → Vercel Deploy

# Canonical copy lives in apk/.github/workflows/ — GitHub only executes files
# in the repository-root .github/workflows/, so keep them in sync with:
#   ./apk/scripts/sync-workflows.sh

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'index.html'
      - 'tsconfig.json'
      - 'tsr.config.json'
      - 'apk/.github/workflows/web-vercel-deploy.yml'
      - '.github/workflows/web-vercel-deploy.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'index.html'
      - 'tsconfig.json'
      - 'tsr.config.json'
      - 'apk/.github/workflows/web-vercel-deploy.yml'
      - '.github/workflows/web-vercel-deploy.yml'
  workflow_dispatch:

concurrency:
  # PR builds get their own group so they can never cancel a live production
  # deploy (and vice versa).
  group: vercel-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'production' }}
  cancel-in-progress: true

jobs:
  workflow-sync:
    name: apk/ is the workflow source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify root .github/workflows matches apk/.github/workflows
        run: bash apk/scripts/sync-workflows.sh --check

  # PRs get a build check only — no deploy, and no repository secrets.
  build:
    name: Build check
    if: github.event_name == 'pull_request'
    needs: workflow-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

  # Pushes to main deploy to Vercel production. Environment variables
  # (DATABASE_URL, VITE_DATABASE_URL, AWS_*, ...) come from the Vercel project
  # itself via `vercel pull` — they are NOT duplicated in GitHub secrets.
  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request'
    needs: workflow-sync
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🚀 Live at $URL" >> "$GITHUB_STEP_SUMMARY"
