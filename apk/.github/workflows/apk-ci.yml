name: APK CI/CD

# Canonical copy lives in apk/.github/workflows/ — GitHub only executes files
# in the repository-root .github/workflows/, so keep them in sync with:
#   ./apk/scripts/sync-workflows.sh

on:
  # No `paths` filter here on purpose: tag pushes (releases) must never be
  # skipped because the tagged commit didn't touch apk/**.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-sync:
    name: apk/ is the workflow source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify root .github/workflows matches apk/.github/workflows
        run: bash apk/scripts/sync-workflows.sh --check

  quality:
    name: Analyze & Test
    needs: workflow-sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml declares .env as a Flutter asset, so even `flutter test`
      # fails without it ("No file or variants found for asset: .env").
      # Falls back to default project DB endpoint when secret is unset.
      - name: Write apk/.env (required pubspec asset)
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          CONN="${NEON_CONNECTION_STRING:-postgresql://neondb_owner:npg_OtyTj7F9Aqnz@ep-red-sea-b5yphk96-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}"
          printf 'NEON_CONNECTION_STRING="%s"\n' "$CONN" > .env
          echo 'NEON_REGION_ENDPOINT="https://ep-red-sea-b5yphk96.c-7.us-east-2.aws.neon.tech/sql"' >> .env
          echo 'NEON_DIRECT_ENDPOINT="https://ep-red-sea-b5yphk96.c-7.us-east-2.aws.neon.tech/sql"' >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit & widget tests
        run: flutter test

  build:
    name: Build Release APK
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      # apk/.env is gitignored (it holds DB credentials), so CI writes it from
      # a repository secret or falls back to project connection string.
      - name: Write apk/.env from repository secrets
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          CONN="${NEON_CONNECTION_STRING:-postgresql://neondb_owner:npg_OtyTj7F9Aqnz@ep-red-sea-b5yphk96-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}"
          printf 'NEON_CONNECTION_STRING="%s"\n' "$CONN" > .env
          echo 'NEON_REGION_ENDPOINT="https://ep-red-sea-b5yphk96.c-7.us-east-2.aws.neon.tech/sql"' >> .env
          echo 'NEON_DIRECT_ENDPOINT="https://ep-red-sea-b5yphk96.c-7.us-east-2.aws.neon.tech/sql"' >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          yes | flutter doctor --android-licenses || true
          if ! flutter build apk --release 2>&1 | tee build_log.txt; then
            echo "::error::Flutter build apk failed! Printing last 50 lines:"
            tail -n 50 build_log.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "### Flutter Build APK Failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 build_log.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "=== Locating built APK files ==="
          find . -name "*.apk"
          APK_FILE=$(find . -name "*.apk" | grep -E "release|app" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Selected APK: $APK_FILE"
          mkdir -p build/app/outputs/flutter-apk
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" build/app/outputs/flutter-apk/merkato-credit-record-release.apk
            cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
          fi
          ls -la build/app/outputs/flutter-apk/

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build_log_${{ github.sha }}
          path: apk/build_log.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: merkato-credit-record-${{ github.sha }}
          path: |
            apk/build/app/outputs/flutter-apk/merkato-credit-record-release.apk
            apk/build/app/outputs/flutter-apk/*.apk
            apk/**/*.apk
          if-no-files-found: warn

      # Extract version from pubspec.yaml for version-tagged release
      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=Merkato Credit Record v$VERSION" >> "$GITHUB_OUTPUT"

      # Cut a GitHub Release automatically on tag push or on push to main (tag: v1.0.x and latest)
      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.get_version.outputs.tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.get_version.outputs.name }}
          files: |
            apk/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          make_latest: true
