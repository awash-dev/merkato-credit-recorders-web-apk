name: Flutter Web → Vercel

# Canonical copy lives in apk/.github/workflows/ — GitHub only executes files
# in the repository-root .github/workflows/, so keep them in sync with:
#   ./apk/scripts/sync-workflows.sh

on:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - '.github/workflows/flutter-web-vercel.yml'
  pull_request:
    paths:
      - 'apk/**'
      - '.github/workflows/flutter-web-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-sync:
    name: apk/ is the workflow source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify root .github/workflows matches apk/.github/workflows
        run: bash apk/scripts/sync-workflows.sh --check

  build-and-deploy:
    name: Build Flutter Web & Deploy
    needs: workflow-sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_aXvmvY25VGNIpTGFNZIEEfkZ' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_Hj97jZLCED6UQy5gjTc7aLSqTnZ0' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web support
        run: flutter config --enable-web

      # apk/.env is bundled as a Flutter asset, so the web build needs it.
      - name: Write apk/.env
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          CONN="${NEON_CONNECTION_STRING:-postgresql://neondb_owner:npg_OtyTj7F9Aqnz@ep-red-sea-b5yphk96-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}"
          printf 'NEON_CONNECTION_STRING="%s"\n' "$CONN" > .env
          echo 'NEON_REGION_ENDPOINT="https://ep-red-sea-b5yphk96.c-7.us-east-2.aws.neon.tech/sql"' >> .env
          echo 'NEON_DIRECT_ENDPOINT="https://ep-red-sea-b5yphk96.c-7.us-east-2.aws.neon.tech/sql"' >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web (release)
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: merkato-credit-record-web-${{ github.sha }}
          path: apk/build/web
          if-no-files-found: error

      # Deploys the static build with the Vercel CLI.
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: apk/build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret is not configured in GitHub repository secrets. Vercel deployment skipped in CI. (Deploy anytime locally via 'npm run deploy:web' or set VERCEL_TOKEN in Settings → Secrets and variables → Actions)."
          else
            URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --project=merkato-credit-recorders-web-apk | tail -n 1)
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "🌐 Flutter web live at $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
